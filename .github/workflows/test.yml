name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 libxml2-utils zsh
      - name: Run tests
        run: LUA_BIN=lua5.4 LUAC_BIN=luac5.4 zsh Tests/run.sh
